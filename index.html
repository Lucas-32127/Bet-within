<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bet-Within - Todas Ligas</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#eef2f5;padding-bottom:85px}.top{background:#111;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100}.hero{margin:10px;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);border-radius:16px;padding:14px;color:#fff;display:flex;justify-content:space-between}.badge{background:#25D366;color:#000;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900}.filters{display:flex;gap:7px;padding:8px 10px;overflow-x:auto;position:sticky;top:52px;background:#eef2f5;z-index:90}.filter{background:#fff;border:1px solid #ddd;padding:7px 12px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap;cursor:pointer}.filter.on{background:#111;color:#fff;border-color:#111}.league{margin:12px 8px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.07);border:1px solid #e5e9ec}.league-header{background:#2c3e50;color:#fff;padding:10px 12px;display:flex;gap:8px;font-weight:900;font-size:13px;align-items:center}.table-header{display:grid;grid-template-columns:1.5fr.55fr.7fr.5fr.45fr;background:#34495e;color:#fff;padding:8px 6px;font-size:10px;font-weight:800;text-align:center}.table-row{display:grid;grid-template-columns:1.5fr.55fr.7fr.5fr.45fr;padding:10px 6px;font-size:10px;text-align:center;align-items:center;border-bottom:1px solid #eef2f5}.table-row:nth-child(even){background:#f8fafb}.stake.Large{color:#e74c3c;font-weight:900}.stake.Medium{color:#f39c12;font-weight:800}.stake.Small{color:#27ae60;font-weight:700}.btn-league{display:flex;justify-content:center;padding:8px}.btn-league a{background:#7ac47f;color:#fff;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:800;text-decoration:none}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:80}.bottom div{text-align:center;font-size:9px;flex:1;color:#888;font-weight:800;cursor:pointer}.bottom div.on{color:#111}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:93vh;overflow:auto}.head{padding:14px;position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-weight:900}.body{padding:14px}.inp{width:100%;padding:11px;border-radius:9px;border:1px solid #ddd;margin:5px 0;font-size:12px}.btn{width:100%;padding:11px;border-radius:9px;border:0;font-weight:900;margin-top:6px;cursor:pointer}.btnP{background:#111;color:#fff}.btnG{background:#25D366;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.searchBox{margin:8px 10px;background:#fff;border-radius:10px;padding:8px;display:flex;gap:6px;border:1px solid #ddd}</style></head><body><div class="top"><div><b>Bet<span style="color:#25D366">-Within</span></b><div style="font-size:8px;opacity:.7">TODAS LIGAS • 925 356 739 • TAXA 78% GREEN</div></div><div style="display:flex;gap:6px;align-items:center"><span class="badge" id="totalLigas">35 LIGAS</span><span class="badge" style="background:#fff;color:#000">● AO VIVO</span></div></div><div class="hero"><div><div style="background:#25D366;color:#000;padding:3px 8px;border-radius:20px;font-size:8px;font-weight:900;display:inline-block">🔥 12 GREEN HOJE</div><div style="font-weight:900;font-size:14px;margin-top:5px;line-height:1.2">Todas Ligas do Mundo<br>Palpites Grátis 24h</div><div style="font-size:9px;opacity:.8;margin-top:3px">✓ Premier • La Liga • Girabola • Champions • +30 ligas</div></div><div style="font-size:32px">🌍</div></div><div class="searchBox"><input id="busca" class="inp" style="margin:0;flex:1" placeholder="🔍 Buscar liga: ex: Premier, La Liga, Girabola..." onkeyup="filtrar()"><button class="btn btnP" style="width:auto;margin:0;padding:0 12px" onclick="filtrar()">Buscar</button></div><div class="filters" id="filters"></div><div id="leaguesContainer"></div><div class="bottom"><div class="on" onclick="window.scrollTo(0,0)">🏠<br>Inicio</div><div onclick="openM('adm')">⚙️<br>ADM</div><div onclick="openM('como')">❓<br>Ligas</div><div onclick="window.open('https://wa.me/244925356739?text=Quero%20VIP%20Bet-Within%20Todas%20Ligas','_blank')">📲<br>VIP</div></div><div id="mAdm" class="modal"><div class="sheet"><div class="head"><span>⚙️ ADM - Todas Ligas</span><span onclick="closeM()" style="background:#ff3b30;color:#fff;padding:5px 10px;border-radius:20px;cursor:pointer">✕</span></div><div class="body"><div style="background:#f5f6f7;border-radius:12px;padding:10px"><b style="font-size:11px">➕ ADICIONAR JOGO DE QUALQUER LIGA</b><input class="inp" id="pLiga" list="ligasList" placeholder="Liga: ex: Premier League" value=""><datalist id="ligasList"></datalist><div class="grid2"><input class="inp" id="pCasa" placeholder="Casa: Man City"><input class="inp" id="pFora" placeholder="Fora: Arsenal"></div><div class="grid2"><input class="inp" id="pGolsCasa" type="number" placeholder="Gols Casa"><input class="inp" id="pGolsFora" type="number" placeholder="Gols Fora"></div><div class="grid2"><select class="inp" id="pStake"><option>Small</option><option>Medium</option><option selected>Large</option></select><select class="inp" id="pPalpite"><option>Home Win</option><option>Away Win</option><option>Draw</option><option>BTTS Yes</option><option>Over 2.5</option><option>Under 2.5</option><option>Over 1.5</option></select></div><div class="grid2"><input class="inp" id="pPredResult" placeholder="Palpite: 2-1"><select class="inp" id="pSuccess"><option value="win">✅ Green ⭐</option><option value="loss">❌ Red</option><option value="pending">⏳ Pendente</option></select></div><button class="btn btnP" onclick="addPalpite()">💾 PUBLICAR NA LIGA</button><button class="btn btnG" onclick="addLigasMundo()">🌍 ADICIONAR TODAS AS 35 LIGAS AUTOMÁTICO</button></div><div id="admLista" style="margin-top:10px"></div><button class="btn" style="background:#eee;margin-top:8px" onclick="if(confirm('Apagar tudo e voltar ao padrão?')){localStorage.removeItem('bet_within_v2');location.reload()}">🔄 Resetar Padrão</button></div></div></div><div id="mComo" class="modal"><div class="sheet"><div class="head"><span>🌍 35 Ligas Disponíveis</span><span onclick="closeM()" style="background:#eee;padding:5px 10px;border-radius:20px">✕</span></div><div class="body" style="font-size:11px;line-height:1.6" id="listaLigasInfo"></div></div></div><script>
var todasLigas=["Premier League","La Liga","Serie A","Bundesliga","Ligue 1","Champions League","Europa League","Conference League","UEFA Nations League","England FA Cup","England Championship","La Liga 2","Serie B","Bundesliga 2","Girabola","Angola Cup","Premier League Angola","Liga Portugal","Eredivisie","Jupiler Pro League","Brasileirão Série A","Brasileirão Série B","Liga Argentina","MLS","Saudi Pro League","Turkish Super Lig","Scottish Premiership","Champions League Africa","Copa Libertadores","Copa Sudamericana","World Cup Qualifiers","AFCON Qualifiers","Euro Qualifiers","Copa del Rey","Coppa Italia"];
var defaultData=[{liga:"Premier League",casa:"Man City",fora:"Arsenal",gc:2,gf:1,stake:"Large",palpite:"Home Win",pred:"2-1",success:"win"},{liga:"Premier League",casa:"Liverpool",fora:"Chelsea",gc:1,gf:1,stake:"Medium",palpite:"Draw",pred:"1-1",success:"win"},{liga:"La Liga",casa:"Real Madrid",fora:"Barcelona",gc:2,gf:1,stake:"Large",palpite:"Home Win",pred:"2-1",success:"win"},{liga:"Serie A",casa:"Inter",fora:"AC Milan",gc:1,gf:0,stake:"Large",palpite:"Home Win",pred:"1-0",success:"win"},{liga:"Bundesliga",casa:"Bayern Munich",fora:"Dortmund",gc:3,gf:2,stake:"Large",palpite:"Over 2.5",pred:"3-2",success:"win"},{liga:"Ligue 1",casa:"PSG",fora:"Marseille",gc:2,gf:0,stake:"Medium",palpite:"Home Win",pred:"2-0",success:"win"},{liga:"Champions League",casa:"Real Madrid",fora:"Man City",gc:1,gf:1,stake:"Large",palpite:"Draw",pred:"1-1",success:"win"},{liga:"Girabola",casa:"Petro Luanda",fora:"1º de Agosto",gc:1,gf:0,stake:"Large",palpite:"Home Win",pred:"1-0",success:"win"},{liga:"Girabola",casa:"Sagrada",fora:"Interclube",gc:2,gf:1,stake:"Medium",palpite:"Home Win",pred:"2-1",success:"win"},{liga:"Brasileirão Série A",casa:"Flamengo",fora:"Palmeiras",gc:2,gf:2,stake:"Medium",palpite:"BTTS Yes",pred:"2-2",success:"win"},{liga:"UEFA Nations League",casa:"Spain",fora:"Czech Republic",gc:3,gf:1,stake:"Large",palpite:"Home Win",pred:"3-1",success:"win"},{liga:"England FA Cup",casa:"Bury Town",fora:"Spalding Utd",gc:1,gf:1,stake:"Small",palpite:"Draw",pred:"1-1",success:"win"}];
var dados;try{dados=JSON.parse(localStorage.getItem('bet_within_v2')||'null')||defaultData}catch(e){dados=defaultData}
var filtroAtual='';
function save(){localStorage.setItem('bet_within_v2',JSON.stringify(dados))}
function renderFiltros(){var f=document.getElementById('filters');var ligasUnicas=[...new Set(dados.map(d=>d.liga))];var todas=[...new Set([...todasLigas,...ligasUnicas])].sort();var html='<div class="filter '+(filtroAtual==''?'on':'')+'" onclick="setFilter(this,\'\')">Tudo ('+dados.length+')</div>';todas.forEach(l=>{var count=dados.filter(d=>d.liga==l).length;var label=count>0? l+' ('+count+')' : l;html+='<div class="filter '+(filtroAtual==l?'on':'')+'" onclick="setFilter(this,\''+l+'\')">'+label+'</div>'});f.innerHTML=html;var dl=document.getElementById('ligasList');dl.innerHTML=todas.map(l=>'<option value="'+l+'">').join('');document.getElementById('totalLigas').innerText=todas.length+' LIGAS';var info=document.getElementById('listaLigasInfo');info.innerHTML=todas.map(l=>{var c=dados.filter(d=>d.liga==l).length;return '<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0"><span>⚽ '+l+'</span><span style="background:'+(c>0?'#25D366':'#eee')+';padding:2px 8px;border-radius:10px;font-size:9px">'+c+' jogos</span></div>'}).join('')+'<br><button class="btn btnP" onclick="closeM()">Fechar</button>'}
function setFilter(el,f){filtroAtual=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));el.classList.add('on');render()}function filtrar(){var q=document.getElementById('busca').value.toLowerCase().trim();if(!q){filtroAtual='';render();return}var achou=todasLigas.find(l=>l.toLowerCase().includes(q))||[...new Set(dados.map(d=>d.liga))].find(l=>l.toLowerCase().includes(q));if(achou){filtroAtual=achou;render()}else{filtroAtual='BUSCA:'+q;renderBusca(q)}}function renderBusca(q){var cont=document.getElementById('leaguesContainer');var filtrados=dados.filter(d=> d.liga.toLowerCase().includes(q)||d.casa.toLowerCase().includes(q)||d.fora.toLowerCase().includes(q));if(filtrados.length==0){cont.innerHTML='<div style="text-align:center;padding:20px;background:#fff;margin:10px;border-radius:12px">Nenhum jogo encontrado para "'+q+'"<br><br><button class="btn btnP" style="width:auto;padding:8px 16px" onclick="document.getElementById(\'busca\').value=\'\';filtroAtual=\'\';render()">Ver Tudo</button></div>';return}var ligas=[...new Set(filtrados.map(d=>d.liga))];var html='';ligas.forEach(liga=>{var jogos=filtrados.filter(d=>d.liga==liga);html+='<div class="league"><div class="league-header"><span>'+liga+'</span><span style="margin-left:auto;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;font-size:9px">'+jogos.length+' jogos</span></div><div class="table-header"><div>Result</div><div>Stake</div><div>Prediction</div><div></div><div>Success?</div></div>';jogos.forEach(g=>{var s=g.success=='win'?'⭐':'❌';html+='<div class="table-row"><div style="font-weight:700;font-size:10px">'+g.casa+' '+g.gc+' '+g.fora+' '+g.gf+'</div><div class="stake '+g.stake+'">'+g.stake+'</div><div style="font-weight:700;font-size:10px">'+g.palpite+'</div><div style="font-weight:700;font-size:10px">'+g.pred+'</div><div style="font-size:14px">'+s+'</div></div>'});html+='<div class="btn-league"><a href="#">'+liga+' Predictions</a></div></div>'});cont.innerHTML=html}
function render(){if(filtroAtual.startsWith('BUSCA:')){renderBusca(filtroAtual.replace('BUSCA:',''));return}var cont=document.getElementById('leaguesContainer');var filtrados=filtroAtual?dados.filter(d=>d.liga==filtroAtual):dados;var ligas=[...new Set(filtrados.map(d=>d.liga))];var html='';if(filtrados.length==0&&filtroAtual){html='<div style="text-align:center;padding:30px;background:#fff;margin:10px;border-radius:12px">Ainda sem jogos na <b>'+filtroAtual+'</b><br><br><button class="btn btnP" style="width:auto" onclick="openM(\'adm\');document.getElementById(\'pLiga\').value=\''+filtroAtual+'\'">➕ Adicionar jogo nesta liga</button></div>';cont.innerHTML=html;renderFiltros();return}ligas.forEach(liga=>{var jogos=filtrados.filter(d=>d.liga==liga);html+='<div class="league"><div class="league-header"><span>'+liga+'</span><span style="margin-left:auto;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;font-size:9px">'+jogos.length+' jogos</span></div><div class="table-header"><div>Result</div><div>Stake</div><div>Prediction</div><div></div><div>Success?</div></div>';jogos.forEach(g=>{var s=g.success=='win'?'⭐':g.success=='loss'?'❌':'⏳';html+='<div class="table-row"><div style="font-weight:700;font-size:10px">'+g.casa+' '+g.gc+' '+g.fora+' '+g.gf+'</div><div class="stake '+g.stake+'">'+g.stake+'</div><div style="font-weight:700;font-size:10px">'+g.palpite+'</div><div style="font-weight:700;font-size:10px">'+g.pred+'</div><div style="font-size:14px">'+s+'</div></div>'});html+='<div class="btn-league"><a href="#">'+liga+' Predictions</a></div></div>'});cont.innerHTML=html;renderFiltros();renderAdm()}
function addPalpite(){var liga=document.getElementById('pLiga').value.trim(),casa=document.getElementById('pCasa').value.trim(),fora=document.getElementById('pFora').value.trim(),gc=parseInt(document.getElementById('pGolsCasa').value)||0,gf=parseInt(document.getElementById('pGolsFora').value)||0,stake=document.getElementById('pStake').value,palpite=document.getElementById('pPalpite').value,pred=document.getElementById('pPredResult').value||(gc+'-'+gf),success=document.getElementById('pSuccess').value;if(!liga||!casa||!fora){alert('Preencha Liga, Casa e Fora');return}dados.unshift({liga:liga,casa:casa,fora:fora,gc:gc,gf:gf,stake:stake,palpite:palpite,pred:pred,success:success});save();render();alert('✅ Publicado em '+liga+'!')}
function addLigasMundo(){var extras=[{liga:"Premier League",casa:"Man United",fora:"Tottenham",gc:2,gf:0,stake:"Medium",palpite:"Home Win",pred:"2-0",success:"win"},{liga:"La Liga",casa:"Real Sociedad",fora:"Villarreal",gc:1,gf:1,stake:"Small",palpite:"Draw",pred:"1-1",success:"win"},{liga:"Serie A",casa:"Juventus",fora:"Napoli",gc:2,gf:1,stake:"Large",palpite:"Home Win",pred:"2-1",success:"win"},{liga:"Bundesliga",casa:"Leverkusen",fora:"RB Leipzig",gc:2,gf:2,stake:"Medium",palpite:"Over 2.5",pred:"2-2",success:"win"},{liga:"Liga Portugal",casa:"Sporting",fora:"Braga",gc:2,gf:0,stake:"Large",palpite:"Home Win",pred:"2-0",success:"win"},{liga:"Brasileirão Série A",casa:"Corinthians",fora:"Sao Paulo",gc:1,gf:0,stake:"Medium",palpite:"Home Win",pred:"1-0",success:"win"},{liga:"Copa Libertadores",casa:"River Plate",fora:"Boca Juniors",gc:2,gf:1,stake:"Large",palpite:"Home Win",pred:"2-1",success:"win"}];extras.forEach(e=>{if(!dados.find(d=>d.liga==e.liga&&d.casa==e.casa&&d.fora==e.fora)) dados.push(e)});save();render();alert('🌍 Ligas adicionadas! Agora '+[...new Set(dados.map(d=>d.liga))].length+' ligas!')}
function renderAdm(){var el=document.getElementById('admLista');var h='<b style="font-size:11px">'+dados.length+' JOGOS • '+[...new Set(dados.map(d=>d.liga))].length+' LIGAS ATIVAS</b>';for(var i=0;i<Math.min(dados.length,20);i++){var p=dados[i];h+='<div style="background:#fff;border:1px solid #eee;border-radius:8px;padding:6px;margin:4px 0;display:flex;justify-content:space-between;font-size:10px"><div><b>'+p.liga+'</b><br>'+p.casa+' '+p.gc+'-'+p.gf+' '+p.fora+' | '+p.stake+' | '+p.palpite+' '+(p.success=='win'?'⭐':'❌')+'</div><span onclick="dados.splice('+i+',1);save();render()" style="color:red;font-weight:900">🗑️</span></div>'}el.innerHTML=h}
function openM(t){closeM();document.getElementById('m'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('show')}function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}
render();
</script></body></html>
