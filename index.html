)}.card-head b{font-size:11px;letter-spacing:.8px;text-transform:uppercase}.card-head small{background:rgba(255,255,255,.06);padding:4px 8px;border-radius:999px;font-size:9px}.row{display:grid;grid-template-columns:1fr 90px 80px;gap:8px;padding:14px 16px;align-items:center;border-bottom:1px solid rgba(255,255,255,.04)}.row:last-child{border:0}.teams{font-size:13px;font-weight:700;line-height:1.3}.teams span{opacity:.5;font-weight:400;font-size:10px;display:block;margin-top:3px}.score{font-size:18px;font-weight:900;text-align:center}.score small{display:block;font-size:9px;opacity:.5;margin-top:2px;font-weight:700}.badge-pred{font-size:10px;font-weight:800;padding:6px 8px;border-radius:999px;text-align:center;line-height:1.2}.win{background:rgba(52,199,89,.15);color:#7CFF9B;border:1px solid rgba(52,199,89,.3)}.draw{background:rgba(255,204,0,.12);color:#FFD60A;border:1px solid rgba(255,204,0,.25)}.footer-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,.98);border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-around;padding:12px 0;z-index:90}.footer-nav div{text-align:center;font-size:9px;opacity:.5;font-weight:700;cursor:pointer;padding:4px 12px;border-radius:12px}.footer-nav div.on{opacity:1;background:rgba(255,255,255,.08)}.dot{width:6px;height:6px;background:#34c759;border-radius:50%;display:inline-block;animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.7)}70%{box-shadow:0 0 0 6px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}</style></head><body>
<header><div class="logo">Bet<span>-Within</span></div><div style="display:flex;gap:8px"><div class="pill" id="datePill">DOMINGO, 04 DE OUTUBRO</div><div class="pill" style="background:rgba(52,199,89,.15);border-color:rgba(52,199,89,.3);color:#7CFF9B"><span class="dot"></span> AUTO</div></div></header>

{liga:"Brasileirão",flag:"🇧🇷",hora:"21:00",casa:"Flamengo",fora:"Palmeiras",gc:2,gf:2,status:"FT",detail:"Final",stake:"Medium",pred:"BTTS Yes",exact:"2-2"}
];
var filter='';
function loadToday(){
 document.getElementById('datePill').innerText=new Date().toLocaleDateString('pt-AO',{weekday:'long',day:'2-digit',month:'long'}).toUpperCase();
 render();
 window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
 var feed=document.getElementById('feed');
 var filtersEl=document.getElementById('filters');
 var ligas=[...new Set(allGames.map(g=>g.liga))];
 document.getElementById('totalPill').innerText=allGames.length+' JOGOS';
 filtersEl.innerHTML='<div class="chip '+(filter===''?'on':'')+'" onclick="filter=\'\';render()">Tudo ('+allGames.length+')</div>'+ligas.map(l=>{
   var icon=allGames.find(g=>g.liga===l)?.flag||'⚽';
   var isLive=allGames.some(g=>g.liga===l&&g.status==='LIVE');
   return '<div class="chip '+(filter===l?'on':'')+(isLive?' live':'')+'" onclick="filter=\''+l+'\';render()">'+icon+' '+l+' ('+allGames.filter(g=>g.liga===l).length+')</div>';
 }).join('');
 var list=filter? allGames.filter(g=>g.liga===filter) : allGames;
 var grouped={};
 list.forEach(g=>{if(!grouped[g.liga]) grouped[g.liga]=[]; grouped[g.liga].push(g);});
 var html='';
 Object.keys(grouped).forEach(liga=>{
   var jogos=grouped[liga];
   html+='<div class="card"><div class="card-head"><b>'+(jogos[0].flag||'⚽')+' '+liga+'</b><small>'+jogos.length+' jogos • Hoje</small></div>';
   jogos.forEach(j=>{
     var cls=j.pred==='Draw'?'draw':(j.pred==='Home Win'?'win':'win');
     var liveDot=j.status==='LIVE'?'<span class="dot"></span> ':'';
     html+='<div class="row"><div class="teams">'+liveDot+j.casa+' vs '+j.fora+'<span>'+j.hora+' • '+j.detail+'</span></div><div class="score">'+j.gc+' - '+j.gf+'<small>'+j.exact+' EXATO</small></div><div class="badge-pred '+cls+'">'+j.pred+'<br><small>'+j.stake+'</small></div></div>';
   });
   html+='</div>';
 });
 feed.innerHTML=html;
 document.querySelectorAll('.footer-nav div').forEach(d=>d.classList.remove('on'));
 if(filter==='') document.getElementById('btnHoje').classList.add('on');
}
loadToday();
</script></body></html>
