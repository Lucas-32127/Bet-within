0;letter-spacing:.5px}.score.official{color:#7CFF9B}.score.scheduled{color:#FFD60A}.badge{font-size:10px;font-weight:800;padding:7px 10px;border-radius:999px;text-align:center;line-height:1.2}.badge.ft{background:rgba(52,199,89,.15);color:#7CFF9B;border:1px solid rgba(52,199,89,.3)}.badge.live{background:rgba(255,59,48,.15);color:#FF8A80;border:1px solid rgba(255,59,48,.3);animation:pulse 2s infinite}.badge.sched{background:rgba(255,255,255,.06);color:#999;border:1px solid rgba(255,255,255,.1)}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.4)}70%{box-shadow:0 0 0 8px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}.live-bar{display:flex;gap:8px;margin:12px 16px;overflow-x:auto}.chip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:8px 14px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}.chip.on{background:#fff;color:#000}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,.98);border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-around;padding:12px 0}.footer div{font-size:9px;opacity:.5;font-weight:700;text-align:center;cursor:pointer}.footer div.on{opacity:1}</style></head><body>

<script>

function render(){
 document.getElementById('total').innerText=jogos.length+' JOGOS • '+new Date().toLocaleDateString('pt-AO');

 document.getElementById('filters').innerHTML='<div class="chip '+(filter===''?'on':'')+'" onclick="filter=\'\';render()">Tudo ('+jogos.length+')</div>'+ligas.map(l=>{
   var icon=jogos.find(x=>x.liga===l)?.flag||'⚽';
   return '<div class="chip '+(filter===l?'on':'')+'" onclick="filter=\''+l+'\';render()">'+icon+' '+l+'</div>';
 }).join('');
 var list=filter? jogos.filter(j=>j.liga===filter) : jogos;
 var grouped={};
 list.forEach(g=>{if(!grouped[g.liga]) grouped[g.liga]=[]; grouped[g.liga].push(g);});
 var html='';
 Object.keys(grouped).forEach(liga=>{
   var js=grouped[liga];
   html+='<div class="card"><div class="card-head"><b>'+(js[0].flag)+' '+liga+'</b><small>'+js.length+' jogo(s)</small></div>';
   js.forEach(j=>{
     var isFT=j.status==='FT';
     var scoreTxt=isFT? j.gc+' - '+j.gf : ' - ';
     var scoreSub=isFT? '<small class="official">✓ '+j.fonte+'</small>' : '<small class="scheduled">'+j.fonte+'</small>';
     var badgeClass=isFT?'ft':(j.status==='LIVE'?'live':'sched');
     var badgeTxt=isFT?'OFICIAL<br>FT':'AGENDADO<br>'+j.hora;
     html+='<div class="row"><div class="teams">'+j.casa+' vs '+j.fora+'<span>'+j.hora+' • '+j.detail+'</span></div><div class="score">'+scoreTxt+scoreSub+'</div><div class="badge '+badgeClass+'">'+badgeTxt+'</div></div>';
   });
   html+='</div>';
 });
 document.getElementById('feed').innerHTML=html;
}
render();
</script></body></html>
